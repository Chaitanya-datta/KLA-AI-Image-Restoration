# configs/config.yaml
# All paths are relative / CLI-overridable — no machine-specific absolute
# paths are hard-coded here (see README "No machine-specific paths").

dataset:
  # Point these at your local, complete dataset. Overridable with
  # `--data_root` on train.py, which expects data_root/train/NoisyLR and
  # data_root/train/GT (see README "Dataset Configuration").
  train_noisy_dir: "data/train/NoisyLR"
  train_gt_dir: "data/train/GT"
  val_fraction: 0.1        # held out from train/, NOT a separate folder (none was provided)
  split_seed: 42            # fixed seed -> reproducible, deterministic split

model:
  name: "LiteRestoreNet"
  in_channels: 1
  out_channels: 1
  channels: 64
  num_blocks: 8
  scale: 2

loss:
  charbonnier_weight: 1.0
  ssim_weight: 0.2
  gradient_weight: 0.1
  fft_weight: 0.0           # off by default; wired up for future ablation
  data_range: 1.0

train:
  epochs: 200
  batch_size: 16
  num_workers: 0
  seed: 42
  optimizer: "adamw"
  lr: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"        # cosine annealing over `epochs`
  min_lr: 1.0e-6
  amp: true                  # mixed precision (only takes effect on CUDA)
  grad_clip_norm: 1.0
  val_every: 1                # validate every N epochs
  checkpoint_dir: "artifacts/checkpoints"
  log_path: "artifacts/logs/train.log"
  history_path: "artifacts/metrics/train_history.json"
  resume_from: null           # path to a checkpoint .pth to resume from
  early_stop_patience: 30      # epochs without val-PSNR improvement before stopping; null disables

inference:
  amp: true
  default_weights: "models/final_model.pth"
